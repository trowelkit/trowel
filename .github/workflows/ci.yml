name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the latest Void release, to catch breaking changes early.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the latest Void
        if: github.event_name == 'schedule'
        run: pnpm -r --filter './packages/*' update void@latest
      # Build first: the examples import the packages through their dist/ output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # Runs the example and the starter template in Void's dev server and checks them end to end.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Blog example
        working-directory: examples/blog-api
        run: |
          pnpm void db push
          ../../scripts/with-dev-server.sh . 5173 ./scripts/e2e.sh
      - name: Starter template
        run: scripts/with-dev-server.sh packages/create-trowel/template 5174 packages/create-trowel/scripts/e2e.sh
